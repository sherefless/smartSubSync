# smartSubSync mpv settings.
#
# Put this file in mpv's script-opts directory:
# Linux:   ~/.config/mpv/script-opts/smartsubsync.conf
# Windows: %APPDATA%\mpv\script-opts\smartsubsync.conf

# Set these to absolute paths after copying this file.
#
# Linux example:
# python=/home/you/apps/smartSubSync/.venv/bin/python
# helper_path=/home/you/apps/smartSubSync/smartsubsync_cli.py
#
# Windows example:
# python=C:\apps\smartSubSync\.venv\Scripts\python.exe
# helper_path=C:\apps\smartSubSync\smartsubsync_cli.py
python=python3
helper_path=
auto_sync=yes
apply_delay=yes

# Accuracy/speed knobs:
#
# Recommended default:
# window_count=6
# window_duration=60
# search_range=120
#
# Faster, but less robust for sparse dialogue:
# window_count=3
# window_duration=30
# search_range=60
#
# More robust, but slower:
# window_count=8
# window_duration=90
# search_range=180
window_count=6
window_duration=60
search_range=120
coarse_step=0.5
fine_step=0.02
threshold=0.5
min_speech_ms=120
min_silence_ms=180

# Safety checks:
# The delay is not applied if confidence stays below these values.
# If auto_retry is enabled, smartSubSync first retries with a larger sample.
min_overlap_percent=45
min_improvement_percent=8
auto_retry=yes

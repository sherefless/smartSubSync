[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartSubSync"
version = "0.1.0"
description = "CLI tool for estimating subtitle offset from sampled video audio and VAD."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
  { name = "OpenAI Codex" }
]
keywords = ["subtitle", "sync", "vad", "ffmpeg", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "torch",
  "torchaudio",
  "silero-vad",
]

[project.scripts]
fast-sync = "fast_sync:main"

[tool.setuptools]
py-modules = ["fast_sync"]

[tool.setuptools.packages.find]
include = ["fast_sync_lib*"]

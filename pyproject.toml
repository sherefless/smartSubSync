[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartSubSync"
version = "0.1.0"
description = "mpv subtitle synchronization helper using sampled audio activity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "smartSubSync contributors" }
]

[tool.setuptools]
py-modules = ["smartsubsync_cli"]

[tool.setuptools.packages.find]
include = ["smartsubsync*"]

[project.optional-dependencies]
silero = [
  "torch",
  "torchaudio",
  "silero-vad",
  "numpy",
]
